<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131820" media="(prefers-color-scheme: dark)">
<title>qBittorrent</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<script>
/* 在样式应用前定好主题，否则暗色用户会看到一帧白闪。 */
try{
  var t=localStorage.getItem('qbview-theme')||
        (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.dataset.theme=t;
  document.documentElement.style.colorScheme=t;
}catch(e){}
</script>
</head>
<body>
<div class="frame">

  <aside class="sidebar">
    <div class="brand">
      <img class="brand-logo" src="icon.png" alt="">
      <span class="brand-name">qBittorrent</span>
    </div>

    <nav class="tabs" id="filters">
      <button class="on" data-filter="all">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>全部</span><em data-count="all">0</em>
      </button>
      <button data-filter="down">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0 4-4m-4 4-4-4"/><path d="M5 19h14"/></svg>
        <span>下载中</span><em data-count="down">0</em>
      </button>
      <button data-filter="seed">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9m0 0 4 4m-4-4-4 4"/><path d="M5 5h14"/></svg>
        <span>做种</span><em data-count="seed">0</em>
      </button>
      <button data-filter="pause">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5v14M15 5v14"/></svg>
        <span>已暂停</span><em data-count="pause">0</em>
      </button>
      <button data-filter="error">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5m0 3h.01"/><circle cx="12" cy="12" r="8.5"/></svg>
        <span>异常</span><em data-count="error">0</em>
      </button>
    </nav>

    <div class="side-foot">
      <button class="icon-btn" id="btnTheme" title="切换主题" aria-label="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2m0 14v2M5.6 5.6l1.4 1.4m10 10 1.4 1.4M3 12h2m14 0h2M5.6 18.4 7 17m10-10 1.4-1.4"/><circle cx="12" cy="12" r="3.6"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 13.6H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.7 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="pageTitle">全部</h1>
      <span class="pill" id="connPill">连接中</span>
      <div class="top-actions">
        <button class="btn" id="btnPauseAll">全部暂停</button>
        <button class="btn" id="btnResumeAll">全部继续</button>
      </div>
    </div>

    <div class="banner" id="banner" hidden></div>

    <div class="tiles">
      <div class="tile t-down">
        <div class="tile-hd">
          <span class="ic ic-blue">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v9m0 0 3.5-3.5M12 14 8.5 10.5"/><path d="M5 18h14"/></svg>
          </span>
          <span class="k">下载速度</span>
        </div>
        <b id="gDl">0</b>
      </div>
      <div class="tile t-up">
        <div class="tile-hd">
          <span class="ic ic-orange">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V6m0 0L8.5 9.5M12 6l3.5 3.5"/><path d="M5 18h14"/></svg>
          </span>
          <span class="k">上传速度</span>
        </div>
        <b id="gUp">0</b>
      </div>
      <div class="tile">
        <div class="tile-hd">
          <span class="ic ic-purple">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7.5a5 5 0 0 0 10 0V3"/><path d="M7 3h3.5M13.5 3H17"/></svg>
          </span>
          <span class="k">任务</span>
        </div>
        <b id="cTotal">0</b>
      </div>
      <div class="tile">
        <div class="tile-hd">
          <span class="ic ic-green">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="9" rx="2"/><path d="M17 12h.01"/></svg>
          </span>
          <span class="k">剩余空间</span>
        </div>
        <b id="cFree">—</b>
      </div>
    </div>

    <section class="card">
      <div class="card-hd">
        <span class="ic ic-blue">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h9"/></svg>
        </span>
        <b>任务</b>
        <span class="hint" id="listHint">0 个</span>
      </div>

      <div class="rows" id="list"></div>

      <div class="empty" id="empty" hidden>
        <span class="empty-ic">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5z"/><path d="M12 12v8"/><path d="m4 8.5 8 3.5 8-3.5"/></svg>
        </span>
        <p>这里还没有任务</p>
        <span class="sub">在 qBittorrent 里添加种子，列表会自动出现</span>
      </div>
    </section>
  </main>
</div>

<!-- 设置面板 -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body">
    <h2>连接 qBittorrent</h2>
    <label class="field">
      <span>WebUI 端口</span>
      <div class="port-row">
        <input id="inPort" type="number" inputmode="numeric" min="1" max="65535" placeholder="自动探测中…">
        <button class="btn" id="btnProbe" type="button">自动探测</button>
      </div>
      <span class="field-hint" id="portHint">正在查找本机的 qBittorrent…</span>
    </label>
    <label class="field">
      <span>用户名</span>
      <input id="inUser" type="text" autocomplete="username" placeholder="jun">
    </label>
    <label class="field">
      <span>密码</span>
      <input id="inPass" type="password" autocomplete="current-password" placeholder="留空则沿用已保存的密码">
    </label>
    <p class="note">填 qBittorrent WebUI 的账号密码，不是 NAS 账号。凭据只保存在本机数据目录，权限 600。</p>
    <p class="err" id="setupErr" hidden></p>
    <div class="sheet-actions">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn primary" id="btnSave">保存并连接</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
